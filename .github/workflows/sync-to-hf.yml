name: Sync to Hugging Face Space

# GitHub main → HF Space(leedohyang/sky-explorer-Ai) 미러링.
# main 에 push 될 때마다 실행되고, Actions 탭에서 수동 실행도 가능하다.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "::error::HF_TOKEN 시크릿이 없습니다. Settings → Secrets and variables → Actions 에서 추가하세요."
            exit 1
          fi

          # ⚠️⚠️ HF 는 '바이너리 파일'이 들어간 push 를 pre-receive 훅에서 거부한다
          #   (2026-08-10 실측: "Your push was rejected because it contains binary files."
          #    offending: docs/assets/*.png). Xet/LFS 를 안 쓰는 한 바이너리는 못 올린다.
          # → Space 는 app.py + knowledge 만 있으면 되므로,
          #   **바이너리를 뺀 단일 orphan 커밋**을 만들어 그것만 push 한다.
          #   (히스토리에 남아 있는 옛 바이너리 blob 도 같이 안 올라가게 하려면 orphan 이 필수 —
          #    전체 히스토리를 밀면 과거 커밋의 PNG blob 때문에 다시 거부당한다.)
          SRC_SHA="$(git rev-parse HEAD)"
          git checkout --orphan hf-sync
          git rm -r --cached . -q

          # 바이너리 제거 (Space 실행에 불필요한 테스트/문서용 에셋)
          find . -path ./.git -prune -o -type f \
            \( -iname '*.png' -o -iname '*.jpg'  -o -iname '*.jpeg' -o -iname '*.gif' \
            -o -iname '*.webp' -o -iname '*.ico' -o -iname '*.pdf'  -o -iname '*.zip' \
            -o -iname '*.mp4' -o -iname '*.mp3'  -o -iname '*.wav'  -o -iname '*.ogg' \
            -o -iname '*.avi' -o -iname '*.wmv'  -o -iname '*.osg'  -o -iname '*.ttf' \
            -o -iname '*.otf' -o -iname '*.woff' -o -iname '*.woff2' \) -print -delete

          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "sync from GitHub main @ ${SRC_SHA}"

          git remote add space https://huggingface.co/spaces/leedohyang/sky-explorer-Ai
          # 토큰을 remote URL 이나 명령 인자에 넣지 않는다 — 로그/프로세스 목록에 남을 수 있다.
          # credential helper 로 stdin 에만 흘려보낸다.
          git config --local credential.helper \
            '!f() { echo username=leedohyang; echo password=$HF_TOKEN; }; f'
          git push space hf-sync:main --force
